<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Ketty bons plans</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f1ed;color:#222}header{height:85px;background:white;padding:20px 30px;font-size:30px;font-weight:bold;display:flex;justify-content:space-between}button{border:0;border-radius:18px;padding:16px 24px;font-size:22px;font-weight:bold}main{height:calc(100vh - 185px);display:flex;align-items:center;justify-content:center}.home{text-align:center}.home h1{font-size:58px}.card{width:94vw;height:70vh;background:white;border-radius:28px;overflow:hidden;display:grid;grid-template-columns:64% 36%}.pic{background:#ddd;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px}.pic img{width:100%;height:100%;object-fit:cover}.copy{padding:38px;display:flex;flex-direction:column;justify-content:center}.copy h1{font-size:42px}.copy p{font-size:27px}.actions{height:100px;display:flex;gap:15px;justify-content:center;padding:15px}.primary{background:#222;color:white}#hot{position:fixed;right:0;top:0;width:110px;height:110px;z-index:20}.modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center}.panel{background:white;width:90vw;max-height:88vh;overflow:auto;border-radius:25px;padding:28px}.row{border-top:1px solid #ddd;padding:12px;display:flex;gap:10px;align-items:center}.row input{padding:8px;font-size:16px}.close{float:right}</style>
<header>✨ Les bons plans de Ketty <span><button onclick="setLang('fr')">FR</button> <button onclick="setLang('en')">EN</button></span></header><main id="m"></main><div class="actions" id="act" style="display:none"><button onclick="play()">🔊 Réécouter</button><button class="primary" onclick="next()">✨ Un autre bon plan</button><button onclick="home()">🏠 Accueil</button></div><div id="hot"></div><audio id="audio"></audio>
<script>
let items=[],base=[],lang='fr',cur=null,deck=[],timer,taps=[],vol=parseFloat(localStorage.getItem('vol')||'.30'),A=document.getElementById('audio');A.volume=vol;
fetch('bons-plans.json').then(r=>r.json()).then(x=>{base=x;items=JSON.parse(localStorage.getItem('content')||JSON.stringify(x));home()}).catch(()=>m.innerHTML='<h2>⚠️ bons-plans.json introuvable</h2>');
function eligible(){let d=new Date().toISOString().slice(0,10);return items.filter(x=>x.active&&(!x.start||x.start<=d)&&(!x.end||x.end>=d)&&(lang==='fr'?x.fr_title:x.en_title))}
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){clearTimeout(timer);if(cur)timer=setTimeout(home,60000)}document.addEventListener('pointerdown',reset);
function setLang(x){lang=x;deck=[];home()}function home(){clearTimeout(timer);A.pause();cur=null;act.style.display='none';m.innerHTML=`<div class=home><h1>${lang==='fr'?'Un bon plan ?':'Looking for a tip?'}</h1><p>${lang==='fr'?'Ketty a plein d’idées pour vous !':'Ketty has plenty of ideas!'}</p><button class=primary onclick=next()>✨ ${lang==='fr'?'Surprends-moi !':'Surprise me!'}</button></div>`}
function next(){A.pause();if(!deck.length)deck=shuffle(eligible().slice());if(!deck.length)return;cur=deck.pop();let t=lang==='fr'?cur.fr_title:cur.en_title,h=lang==='fr'?cur.fr_hook:cur.en_hook;m.innerHTML=`<div class=card><div class=pic id=pic><img src="${cur.image}" onerror="pic.innerHTML='⚠️<br>Photo introuvable<br>${cur.image}'"></div><div class=copy><h1>${t}</h1><p>${h}</p></div></div>`;act.style.display='flex';play();reset()}
function play(){if(!cur)return;A.src=lang==='fr'?cur.fr_audio:cur.en_audio;A.volume=vol;A.play().catch(()=>{})}
hot.onpointerdown=()=>{let n=Date.now();taps=taps.filter(x=>n-x<1500);taps.push(n);if(taps.length>=3){taps=[];admin()}}
function admin(){A.pause();let q=document.createElement('div');q.className='modal';q.id='adm';q.innerHTML=`<div class=panel><button class=close onclick=adm.remove()>✕</button><h2>Administration</h2><p>Volume <input type=range min=0 max=1 step=.05 value="${vol}" oninput="vol=+this.value;A.volume=vol;vp.innerText=Math.round(vol*100)+'%'"> <b id=vp>${Math.round(vol*100)}%</b> <button onclick=play()>Tester</button></p><p><button onclick=add()>+ Actualité</button> <button onclick=save()>💾 Enregistrer</button></p><div id=list></div></div>`;document.body.appendChild(q);render()}
function render(){list.innerHTML=items.map((x,i)=>`<div class=row><input type=checkbox ${x.active?'checked':''} onchange="items[${i}].active=this.checked"><input value="${x.fr_title}" onchange="items[${i}].fr_title=this.value"><button onclick="edit(${i})">Modifier</button></div>`).join('')}
function edit(i){let x=items[i];for(let k of ['fr_title','fr_hook','en_title','en_hook','image','fr_audio','en_audio','start','end']){let v=prompt(k,x[k]||'');if(v!==null)x[k]=v}render()}
function add(){items.push({id:Date.now(),active:true,category:'actualite',featured:true,start:'',end:'',image:'',fr_title:'Nouvelle actualité',fr_hook:'À découvrir en ce moment !',fr_audio:'',en_title:"What's on now",en_hook:'Discover what is happening!',en_audio:''});render()}
function save(){localStorage.setItem('content',JSON.stringify(items));localStorage.setItem('vol',vol);alert('Enregistré sur cette tablette')}
</script>
