<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Les bons plans de Ketty</title>
<style>
:root{--dark:#20201d;--paper:#f4efe6;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--paper);color:#222;overflow:hidden;touch-action:manipulation}
.top{position:fixed;z-index:20;top:0;left:0;right:0;height:88px;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;color:white;background:linear-gradient(#0009,transparent)}.brand{font-size:29px;font-weight:900}.top button{border:1px solid #fff8;background:#fff2;color:#fff;border-radius:999px;padding:10px 17px;font-size:18px;font-weight:bold}
main{height:100vh}.home{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:white;background:radial-gradient(circle at 15% 35%,#666156 0,transparent 30%),radial-gradient(circle at 85% 70%,#57544b 0,transparent 28%),#1e1e1b}.homebox{max-width:850px;padding:40px}.home h1{font-size:68px;line-height:1.03;margin:10px}.home p{font-size:29px;line-height:1.4}.cta{border:0;border-radius:999px;background:#fff;padding:23px 35px;font-size:28px;font-weight:900}
.tip{height:100%;position:relative;background:#333}.hero{width:100%;height:100%;object-fit:cover;animation:zoom 14s ease-out both}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#000b 0,#0004 58%,transparent),linear-gradient(0deg,#0008,transparent 48%)}.copy{position:absolute;left:55px;bottom:125px;color:white;max-width:760px;animation:up .5s ease}.pill{display:inline-block;padding:10px 16px;border:1px solid #fff6;border-radius:999px;background:#fff2;font-size:20px;font-weight:bold;backdrop-filter:blur(10px)}.copy h1{font-size:57px;line-height:1.04;margin:18px 0 12px}.copy p{font-size:28px;line-height:1.3}
.actions{position:fixed;z-index:15;bottom:0;left:0;right:0;height:98px;background:#f5f1eaea;backdrop-filter:blur(15px);display:flex;justify-content:center;align-items:center;gap:14px}.actions button{border:0;border-radius:18px;background:#fff;padding:17px 24px;font-size:21px;font-weight:bold;box-shadow:0 4px 16px #0002}.actions .primary{background:#222;color:#fff}
#hot{position:fixed;z-index:40;right:0;top:0;width:115px;height:115px}.missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#ded9d0;font-size:26px}
.modal{position:fixed;z-index:60;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}.panel{width:min(1150px,95vw);max-height:91vh;overflow:auto;background:#faf8f3;border-radius:26px;padding:26px}.close{float:right;border:0;border-radius:50%;width:44px;height:44px;font-size:21px}.bar{background:white;border-radius:17px;padding:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.bar button,.row button{border:0;border-radius:11px;padding:10px 13px;font-weight:bold}.section{font-size:22px;font-weight:900;margin:24px 0 8px}.row{background:white;border-radius:15px;padding:12px;margin:8px 0;display:grid;grid-template-columns:38px 44px 1fr auto;gap:10px;align-items:center}.row input[type=text]{width:100%;padding:9px;border:1px solid #ddd;border-radius:9px;font-size:16px}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes zoom{from{transform:scale(1.01)}to{transform:scale(1.07)}}
</style></head><body><div class="top"><div class="brand">✨ Les bons plans de Ketty</div><div><button onclick="setLang('fr')">FR</button> <button onclick="setLang('en')">EN</button></div></div><main id="m"></main><div id="actions" class="actions" style="display:none"><button onclick="play()">🔊 <span id="r">Réécouter</span></button><button class="primary" onclick="next()">✨ <span id="n">Un autre bon plan</span></button><button onclick="home()">⌂ <span id="h">Accueil</span></button></div><div id="hot"></div><audio id="audio"></audio>
<script>
let base=[],items=[],lang='fr',cur=null,deck=[],timer,taps=[],vol=parseFloat(localStorage.getItem('kettyVolume')||'.30');const A=document.getElementById('audio'),M=document.getElementById('m'),ACT=document.getElementById('actions');A.volume=vol;
fetch('bons-plans.json').then(x=>x.json()).then(x=>{base=x;items=JSON.parse(localStorage.getItem('kettyContent')||JSON.stringify(x));home()}).catch(()=>M.innerHTML='<div class="missing">⚠️ Impossible de charger bons-plans.json</div>');
function valid(){let d=new Date().toISOString().slice(0,10);return items.filter(x=>x.active&&(!x.start||x.start<=d)&&(!x.end||x.end>=d)&&(lang==='fr'?x.fr_title:x.en_title))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){clearTimeout(timer);if(cur)timer=setTimeout(home,60000)}document.addEventListener('pointerdown',reset);
function setLang(x){lang=x;deck=[];home()}function home(){clearTimeout(timer);A.pause();cur=null;ACT.style.display='none';let f=lang==='fr';M.innerHTML=`<section class="home"><div class="homebox"><div style="font-size:21px;font-weight:bold;letter-spacing:.1em">PORTE DE DRÔMARDÈCHE</div><h1>${f?'Et si Ketty vous soufflait une idée ?':'Need a little inspiration?'}</h1><p>${f?'Outils, services et découvertes : laissez-vous surprendre.':'Useful services and local discoveries: let Ketty surprise you.'}</p><button class="cta" onclick="next()">✨ ${f?'Donne-moi un bon plan':'Give me a top tip'}</button></div></section>`}
function next(){A.pause();if(!deck.length)deck=shuffle(valid().slice());if(!deck.length)return;cur=deck.pop();let f=lang==='fr',t=f?cur.fr_title:cur.en_title,k=f?cur.fr_hook:cur.en_hook;M.innerHTML=`<section class="tip"><img class="hero" src="${cur.image}" onerror="this.style.display='none';miss.style.display='flex'"><div id="miss" class="missing" style="display:none">⚠️<br>Photo introuvable<br>${cur.image}</div><div class="shade"></div><div class="copy"><div class="pill">${cur.icon||'✨'} ${f?'Le bon plan de Ketty':'Ketty’s top tip'}</div><h1>${t}</h1><p>${k}</p></div></section>`;ACT.style.display='flex';r.textContent=f?'Réécouter':'Replay';n.textContent=f?'Un autre bon plan':'Another tip';h.textContent=f?'Accueil':'Home';play();reset()}
function play(){if(!cur)return;A.src=lang==='fr'?cur.fr_audio:cur.en_audio;A.volume=vol;A.play().catch(()=>{})}
hot.onpointerdown=()=>{let t=Date.now();taps=taps.filter(x=>t-x<1500);taps.push(t);if(taps.length>=3){taps=[];admin()}}
function admin(){A.pause();let q=document.createElement('div');q.className='modal';q.id='adm';q.innerHTML=`<div class="panel"><button class="close" onclick="adm.remove()">✕</button><h2>Administration Ketty</h2><div class="bar"><b>Volume</b><input type="range" min="0" max="1" step=".05" value="${vol}" oninput="vol=+this.value;A.volume=vol;vp.textContent=Math.round(vol*100)+'%'"><b id="vp">${Math.round(vol*100)}%</b><button onclick="play()">🔊 Tester</button><button onclick="addNews()">＋ Ajouter une actualité</button><button onclick="save()">💾 Enregistrer</button></div><div class="section">Bons plans permanents</div><div id="perm"></div><div class="section">📣 En ce moment</div><div id="news"></div></div>`;document.body.appendChild(q);renderAdmin()}
function rows(arr,target){document.getElementById(target).innerHTML=arr.map(x=>{let i=items.indexOf(x);return `<div class="row"><input type="checkbox" ${x.active?'checked':''} onchange="items[${i}].active=this.checked"><div style="font-size:25px">${x.icon||'📣'}</div><input type="text" value="${(x.fr_title||'').replaceAll('"','&quot;')}" onchange="items[${i}].fr_title=this.value"><button onclick="edit(${i})">Modifier</button></div>`}).join('')||'<p style="opacity:.6">Aucune actualité pour le moment.</p>'}
function renderAdmin(){rows(items.filter(x=>x.category!=='actualite'),'perm');rows(items.filter(x=>x.category==='actualite'),'news')}
function edit(i){let x=items[i];for(let k of ['icon','fr_title','fr_hook','fr_script','fr_audio','en_title','en_hook','en_script','en_audio','image','start','end']){let v=prompt(k,x[k]||'');if(v!==null)x[k]=v}renderAdmin()}
function addNews(){items.push({id:'actu-'+Date.now(),icon:'📣',category:'actualite',active:true,featured:true,start:'',end:'',image:'',fr_title:'À découvrir en ce moment',fr_hook:'Une actualité à ne pas manquer !',fr_script:'',fr_audio:'',en_title:"What's on now",en_hook:'Something special is happening!',en_script:'',en_audio:''});renderAdmin()}
function save(){localStorage.setItem('kettyContent',JSON.stringify(items));localStorage.setItem('kettyVolume',vol);alert('Modifications enregistrées sur cette tablette.')}
</script></body></html>
