<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Les bons plans de Ketty</title>
<style>
:root{--ink:#17212b;--paper:#f5f2ec;--card:#fff;--accent:#ff5b45}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:var(--paper);color:var(--ink);touch-action:manipulation}
header{height:84px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 3px 18px #00000012;position:relative;z-index:4}
.brand{font-size:29px;font-weight:900}.langs{display:flex;gap:16px;align-items:center}
.lang{width:70px;height:70px;padding:0;border-radius:50%;background:#fff;border:4px solid transparent;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px #0002;overflow:hidden;touch-action:manipulation}
.lang.on{border-color:var(--accent);box-shadow:0 0 0 4px #ff5b4522}
.flag{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:48px;line-height:1}
.frflag{background:linear-gradient(90deg,#0055a4 0 33.33%,#fff 33.33% 66.66%,#ef4135 66.66% 100%)}
.ukflag{background:#17365d}
button{border:0;cursor:pointer;font-weight:800;font-size:20px}
main{height:calc(100vh - 180px);display:flex;align-items:center;justify-content:center;padding:22px}
.home{text-align:center;max-width:850px}.home h1{font-size:62px;margin:0 0 15px}.home p{font-size:28px;margin:0 0 34px}.primary{background:var(--accent);color:white;padding:20px 32px;border-radius:24px;box-shadow:0 10px 24px #ff5b4540}
.card{width:min(94vw,1450px);height:72vh;background:#fff;border-radius:32px;overflow:hidden;display:grid;grid-template-columns:66% 34%;box-shadow:0 20px 55px #0002}
.pic{position:relative;background:linear-gradient(135deg,#d9e6df,#f1d6b8);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;background:#f3f1ec}.missing{padding:30px;text-align:center;font-size:23px}
.copy{padding:46px;display:flex;flex-direction:column;justify-content:center}.copy h1{font-size:45px;line-height:1.05;margin:0 0 24px}.copy p{font-size:27px;line-height:1.35;margin:0}
.actions{height:96px;display:flex;gap:14px;justify-content:center;align-items:center}.actions button{padding:15px 22px;border-radius:18px}.actions .primary{padding:17px 28px}
#hot{position:fixed;left:0;bottom:0;width:80px;height:80px;z-index:30}
.modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center}.panel{background:white;width:92vw;max-width:1100px;max-height:90vh;overflow:auto;border-radius:28px;padding:30px}
.close{float:right;background:#eee;border-radius:14px;padding:10px 14px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0}.toolbar button{padding:12px 16px;border-radius:14px}
.row{border-top:1px solid #ddd;padding:14px 4px;display:grid;grid-template-columns:50px 1fr 130px;gap:12px;align-items:center}.row input[type=text]{font-size:17px;padding:10px;border:1px solid #ccc;border-radius:10px}
.editor{display:grid;grid-template-columns:180px 1fr;gap:10px 14px;margin-top:20px}.editor input{padding:10px;font-size:16px;border:1px solid #bbb;border-radius:9px}.editor .wide{grid-column:1/-1}
.note{background:#fff5cf;padding:12px 15px;border-radius:12px;font-size:15px}

/* Sélecteur de langue optimisé pour la tablette KettyBot */
.langs{display:flex;gap:14px;align-items:center;padding:6px 22px 6px 6px;flex-shrink:0}
.lang{position:relative;width:72px;height:72px;min-width:72px;min-height:72px;padding:4px;border-radius:50%;border:4px solid transparent;background:#fff;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.16);touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.lang.on{border-color:#ff5b45;box-shadow:0 0 0 3px rgba(255,91,69,.18)}
.flag{position:relative;display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
.frflag{background:linear-gradient(90deg,#0055a4 0 33.333%,#fff 33.333% 66.666%,#ef4135 66.666% 100%)}
.ukflag{background:
linear-gradient(33deg,transparent 43%,#fff 43% 48%,#c8102e 48% 52%,#fff 52% 57%,transparent 57%),
linear-gradient(-33deg,transparent 43%,#fff 43% 48%,#c8102e 48% 52%,#fff 52% 57%,transparent 57%),
linear-gradient(90deg,transparent 38%,#fff 38% 44%,#c8102e 44% 56%,#fff 56% 62%,transparent 62%),
linear-gradient(0deg,transparent 38%,#fff 38% 44%,#c8102e 44% 56%,#fff 56% 62%,transparent 62%),
#012169}
@media(max-width:900px){.langs{padding-right:18px}.lang{width:66px;height:66px;min-width:66px;min-height:66px}}

</style></head>
<body><header><div class="brand" id="brand">✨ Les bons plans de Ketty</div><div class="langs" aria-label="Choix de langue"><button id="frb" class="lang on" type="button" aria-label="Français"><span class="flag frflag" aria-hidden="true"></span></button>
<button id="enb" class="lang" type="button" aria-label="English"><span class="flag ukflag" aria-hidden="true"><i></i></span></button></div></header>
<main id="m"></main><div class="actions" id="act" style="display:none"><button onclick="play()">🔊 Réécouter</button><button class="primary" onclick="next()">✨ Un autre bon plan</button><button onclick="home()">⌂ Accueil</button></div><div id="hot"></div><audio id="audio"></audio>
<script>
let items=[],original=[],lang='fr',cur=null,deck=[],timer=null,taps=[],introPlayed={fr:false,en:false},vol=parseFloat(localStorage.getItem('kettyVolume')||'.30');
const A=document.getElementById('audio'),m=document.getElementById('m'),act=document.getElementById('act'); A.volume=vol;
fetch('bons-plans.json?'+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{original=x;items=JSON.parse(localStorage.getItem('kettyContent')||JSON.stringify(x));home();setTimeout(()=>playIntro('fr'),500)}).catch(()=>m.innerHTML='<div class="home"><h1>⚠️ Configuration introuvable</h1><p>Vérifiez le fichier bons-plans.json.</p></div>');
function eligible(){const d=new Date().toISOString().slice(0,10);return items.filter(x=>x.active&&(!x.start||x.start<=d)&&(!x.end||x.end>=d)&&(lang==='fr'?x.fr_title:x.en_title))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function arm(){clearTimeout(timer);if(cur)timer=setTimeout(home,60000)}
['pointerdown','keydown','touchstart'].forEach(e=>document.addEventListener(e,arm,{passive:true}));
function setLang(x){
  A.pause(); A.removeAttribute('src');
  lang=x; deck=[];
  document.getElementById('frb').classList.toggle('on',x==='fr');
  document.getElementById('enb').classList.toggle('on',x==='en');
  const brand=document.getElementById('brand');
  if(brand) brand.textContent=x==='fr'?'✨ Les bons plans de Ketty':'✨ Ketty’s great deals';
  const btns=act.querySelectorAll('button');
  if(btns.length>=3){
    btns[0].textContent=x==='fr'?'🔊 Réécouter':'🔊 Listen again';
    btns[1].textContent=x==='fr'?'✨ Un autre bon plan':'✨ Another great deal';
    btns[2].textContent=x==='fr'?'⌂ Accueil':'⌂ Home';
  }
  home();
  if(!introPlayed[x]) setTimeout(()=>playIntro(x),250);
}
function home(){clearTimeout(timer);A.pause();A.removeAttribute('src');cur=null;act.style.display='none';m.innerHTML=`<div class="home"><h1>${lang==='fr'?'Un bon plan ?':'Looking for a tip?'}</h1><p>${lang==='fr'?'Touchez le bouton et laissez Ketty vous surprendre.':'Tap the button and let Ketty surprise you.'}</p><button class="primary" onclick="next()">✨ ${lang==='fr'?'Surprends-moi !':'Surprise me!'}</button></div>`}
function next(){A.pause();if(!deck.length)deck=shuffle(eligible().slice());if(!deck.length){m.innerHTML='<div class=home><h1>Aucun bon plan actif</h1></div>';return}cur=deck.pop();const t=lang==='fr'?cur.fr_title:cur.en_title,h=lang==='fr'?cur.fr_hook:cur.en_hook;
m.innerHTML=`<div class="card"><div class="pic" id="pic"><img src="${cur.image}" alt="" onerror="this.remove();pic.innerHTML='<div class=missing>📷<br>Photo à ajouter<br><small>${cur.image}</small></div>'"></div><div class="copy"><h1>${esc(t)}</h1><p>${esc(h)}</p></div></div>`;act.style.display='flex';play();arm()}

function playIntro(x){
  if(introPlayed[x]) return;
  introPlayed[x]=true;
  A.pause();
  A.src='audio/'+x+'/intro.mp3';
  A.volume=vol;
  A.play().catch(()=>{ introPlayed[x]=false; });
}

function play(){if(!cur)return;const src=lang==='fr'?cur.fr_audio:cur.en_audio;if(!src)return;A.src=src;A.volume=vol;A.play().catch(()=>{})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
hot.onpointerdown=()=>{let n=Date.now();taps=taps.filter(x=>n-x<1500);taps.push(n);if(taps.length>=3){taps=[];admin()}}
function admin(){A.pause();const q=document.createElement('div');q.className='modal';q.id='adm';q.innerHTML=`<div class=panel><button class=close onclick=adm.remove()>✕</button><h2>Administration Ketty</h2><div class=note>Les changements faits ici sont enregistrés sur cette tablette. Pour les rendre permanents sur toutes les tablettes, modifiez aussi bons-plans.json sur GitHub.</div><div class=toolbar>Volume <input type=range min=0 max=1 step=.05 value="${vol}" oninput="vol=+this.value;A.volume=vol;vp.innerText=Math.round(vol*100)+'%'"><b id=vp>${Math.round(vol*100)}%</b><button onclick=play()>Tester</button><button onclick=addNews()>+ Actualité</button><button onclick=save()>💾 Enregistrer</button><button onclick=restore()>↺ Recharger GitHub</button></div><div id=list></div><div id=editbox></div></div>`;document.body.appendChild(q);render()}
function render(){list.innerHTML=items.map((x,i)=>`<div class=row><input type=checkbox ${x.active?'checked':''} onchange="items[${i}].active=this.checked"><input type=text value="${esc(x.fr_title)}" onchange="items[${i}].fr_title=this.value"><button onclick="edit(${i})">Modifier</button></div>`).join('')}
function edit(i){let x=items[i],fields=['fr_title','fr_hook','en_title','en_hook','image','fr_audio','en_audio','start','end'];editbox.innerHTML=`<h3>Modifier : ${esc(x.fr_title)}</h3><div class=editor>${fields.map(k=>`<label>${k}</label><input value="${esc(x[k]||'')}" oninput="items[${i}]['${k}']=this.value">`).join('')}<button class="wide primary" onclick="render();editbox.innerHTML=''">Valider cette fiche</button></div>`;editbox.scrollIntoView({behavior:'smooth'})}
function addNews(){items.push({id:'actu-'+Date.now(),active:true,category:'actualite',start:'',end:'',image:'photos/en-ce-moment.jpg',fr_title:'En ce moment',fr_hook:'À découvrir en ce moment !',fr_audio:'audio/fr/en-ce-moment.mp3',en_title:"What's on now",en_hook:'Discover what is happening now!',en_audio:'audio/en/en-ce-moment.mp3'});render()}
function save(){localStorage.setItem('kettyContent',JSON.stringify(items));localStorage.setItem('kettyVolume',vol);alert('Enregistré sur cette tablette.')}
function restore(){if(confirm('Effacer les modifications locales et recharger la version GitHub ?')){localStorage.removeItem('kettyContent');location.reload()}}

function bindLanguageButtons(){
  const frBtn=document.getElementById('frb');
  const enBtn=document.getElementById('enb');
  if(frBtn) frBtn.onclick=function(e){e.preventDefault();setLang('fr');};
  if(enBtn) enBtn.onclick=function(e){e.preventDefault();setLang('en');};
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',bindLanguageButtons);
}else{
  bindLanguageButtons();
}

</script></body></html>
