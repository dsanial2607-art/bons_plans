<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Les bons plans de Ketty</title>
<style>
:root{--ink:#22221f;--paper:#f6f1e8;--glass:rgba(18,18,16,.58);--white:#fff;--shadow:0 18px 55px rgba(0,0,0,.18)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--paper);color:var(--ink);overflow:hidden;touch-action:manipulation}
.app{height:100vh;position:relative}.top{position:absolute;z-index:12;top:0;left:0;right:0;height:90px;display:flex;align-items:center;justify-content:space-between;padding:20px 30px;background:linear-gradient(#0008,transparent);color:#fff}
.brand{font-size:29px;font-weight:900;text-shadow:0 2px 10px #0006}.lang{display:flex;gap:8px}.lang button{border:1px solid #fff7;background:#fff2;color:#fff;border-radius:999px;padding:10px 17px;font-size:18px;font-weight:800;backdrop-filter:blur(10px)}
main{height:100vh}.home{height:100%;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(135deg,#3c3a33,#171714);overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.18;background:#fff}.o1{width:420px;height:420px;left:-100px;top:120px}.o2{width:300px;height:300px;right:-70px;bottom:80px}.homebox{z-index:2;max-width:850px;padding:50px}.eyebrow{font-size:22px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.82}.home h1{font-size:68px;line-height:1.02;margin:15px 0}.home p{font-size:29px;line-height:1.35;margin:0 auto 34px;max-width:700px}.cta{border:0;border-radius:999px;padding:23px 34px;font-size:28px;font-weight:900;background:#fff;color:#222;box-shadow:var(--shadow);transform:translateZ(0)}
.tip{height:100%;position:relative;background:#333;overflow:hidden}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:ken 14s ease-out both}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.68) 0%,rgba(0,0,0,.22) 55%,rgba(0,0,0,.08) 100%),linear-gradient(0deg,rgba(0,0,0,.55),transparent 45%)}
.copy{position:absolute;z-index:5;left:55px;bottom:125px;color:#fff;max-width:720px;animation:rise .55s ease both}.pill{display:inline-flex;align-items:center;gap:10px;background:#fff2;border:1px solid #fff5;backdrop-filter:blur(12px);border-radius:999px;padding:10px 15px;font-size:20px;font-weight:800}.copy h1{font-size:58px;line-height:1.03;margin:18px 0 12px;text-shadow:0 4px 18px #0008}.copy p{font-size:28px;line-height:1.3;margin:0;text-shadow:0 3px 12px #0009}
.actions{position:absolute;z-index:8;left:0;right:0;bottom:0;height:98px;display:flex;align-items:center;justify-content:center;gap:13px;padding:13px;background:rgba(245,241,233,.92);backdrop-filter:blur(18px)}
.actions button{border:0;border-radius:18px;padding:17px 24px;font-size:21px;font-weight:850;background:#fff;box-shadow:0 5px 18px #0002}.actions .primary{background:#222;color:#fff;padding-left:30px;padding-right:30px}
.missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#ded9d0;font-size:26px;padding:30px}
#hot{position:fixed;z-index:99;right:0;top:0;width:115px;height:115px}.modal{position:fixed;inset:0;z-index:100;background:#000a;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}.panel{width:min(1050px,94vw);max-height:90vh;overflow:auto;background:#faf8f3;border-radius:28px;padding:28px;box-shadow:var(--shadow)}.panel h2{font-size:30px;margin:0 0 20px}.close{float:right;border:0;background:#eee;border-radius:50%;width:46px;height:46px;font-size:22px}.adminbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px;background:#fff;border-radius:18px;margin-bottom:18px}.adminbar button,.row button{border:0;border-radius:12px;padding:10px 14px;font-weight:bold}.row{background:#fff;border-radius:16px;padding:13px;margin:9px 0;display:grid;grid-template-columns:42px 52px 1fr auto;gap:10px;align-items:center}.row input[type=text]{padding:10px;border:1px solid #ddd;border-radius:10px;font-size:16px;width:100%}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes ken{from{transform:scale(1.02)}to{transform:scale(1.08)}}
</style></head><body><div class="app"><div class="top"><div class="brand">✨ Les bons plans de Ketty</div><div class="lang"><button onclick="setLang('fr')">FR</button><button onclick="setLang('en')">EN</button></div></div><main id="main"></main><div id="actions" class="actions" style="display:none"><button onclick="play()">🔊 <span id="rep">Réécouter</span></button><button class="primary" onclick="next()">✨ <span id="nxt">Un autre bon plan</span></button><button onclick="home()">⌂ <span id="hom">Accueil</span></button></div></div><div id="hot"></div><audio id="audio"></audio>
<script>
let base=[],items=[],lang='fr',cur=null,deck=[],timer,taps=[],vol=parseFloat(localStorage.getItem('kettyVolume')||'.30');const M=document.getElementById('main'),ACT=document.getElementById('actions'),A=document.getElementById('audio');A.volume=vol;
fetch('bons-plans.json').then(r=>r.json()).then(x=>{base=x;items=JSON.parse(localStorage.getItem('kettyContent')||JSON.stringify(x));home()}).catch(()=>M.innerHTML='<div class="missing">⚠️ Impossible de charger les contenus.</div>');
function eligible(){let d=new Date().toISOString().slice(0,10);return items.filter(x=>x.active&&(!x.start||x.start<=d)&&(!x.end||x.end>=d)&&(lang==='fr'?x.fr_title:x.en_title))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function resetIdle(){clearTimeout(timer);if(cur)timer=setTimeout(home,60000)}document.addEventListener('pointerdown',resetIdle);
function setLang(x){lang=x;deck=[];home()}
function home(){clearTimeout(timer);A.pause();cur=null;ACT.style.display='none';let f=lang==='fr';M.innerHTML=`<section class="home"><div class="orb o1"></div><div class="orb o2"></div><div class="homebox"><div class="eyebrow">${f?'Porte de DrômArdèche':'Porte de DrômArdèche'}</div><h1>${f?'Et si Ketty vous soufflait une idée ?':'Need a little inspiration?'}</h1><p>${f?'Balades, bons plans, services et découvertes : laissez-vous surprendre.':'Walks, useful services and local discoveries: let Ketty surprise you.'}</p><button class="cta" onclick="next()">✨ ${f?'Donne-moi un bon plan':'Give me a top tip'}</button></div></section>`}
function next(){A.pause();if(!deck.length)deck=shuffle(eligible().slice());if(!deck.length)return;cur=deck.pop();render();play();resetIdle()}
function render(){let f=lang==='fr',t=f?cur.fr_title:cur.en_title,h=f?cur.fr_hook:cur.en_hook;M.innerHTML=`<section class="tip"><img class="hero" src="${cur.image}" onerror="this.style.display='none';document.getElementById('miss').style.display='flex'"><div id="miss" class="missing" style="display:none">⚠️<br>Photo introuvable<br>${cur.image}</div><div class="shade"></div><div class="copy"><div class="pill">${cur.icon||'✨'} ${f?'Le bon plan de Ketty':'Ketty’s top tip'}</div><h1>${t}</h1><p>${h}</p></div></section>`;ACT.style.display='flex';document.getElementById('rep').textContent=f?'Réécouter':'Replay';document.getElementById('nxt').textContent=f?'Un autre bon plan':'Another tip';document.getElementById('hom').textContent=f?'Accueil':'Home'}
function play(){if(!cur)return;A.src=lang==='fr'?cur.fr_audio:cur.en_audio;A.volume=vol;A.play().catch(()=>{})}
document.getElementById('hot').onpointerdown=()=>{let n=Date.now();taps=taps.filter(x=>n-x<1500);taps.push(n);if(taps.length>=3){taps=[];admin()}}
function admin(){A.pause();let q=document.createElement('div');q.className='modal';q.id='adm';q.innerHTML=`<div class="panel"><button class="close" onclick="adm.remove()">✕</button><h2>Administration Ketty</h2><div class="adminbar"><b>Volume</b><input type="range" min="0" max="1" step=".05" value="${vol}" oninput="vol=+this.value;A.volume=vol;vp.innerText=Math.round(vol*100)+'%'"><b id="vp">${Math.round(vol*100)}%</b><button onclick="play()">🔊 Tester</button><button onclick="addNews()">＋ Actualité</button><button onclick="save()">💾 Enregistrer</button></div><div id="list"></div></div>`;document.body.appendChild(q);renderAdmin()}
function renderAdmin(){let L=document.getElementById('list');L.innerHTML=items.map((x,i)=>`<div class="row"><input type="checkbox" ${x.active?'checked':''} onchange="items[${i}].active=this.checked"><div style="font-size:26px">${x.icon||'✨'}</div><input type="text" value="${(x.fr_title||'').replaceAll('"','&quot;')}" onchange="items[${i}].fr_title=this.value"><button onclick="edit(${i})">Modifier</button></div>`).join('')}
function edit(i){let x=items[i];for(let k of ['icon','fr_title','fr_hook','en_title','en_hook','image','fr_audio','en_audio','start','end']){let v=prompt(k,x[k]||'');if(v!==null)x[k]=v}renderAdmin()}
function addNews(){items.push({id:'actu-'+Date.now(),icon:'📣',active:true,category:'actualite',featured:true,start:'',end:'',image:'',fr_title:'À découvrir en ce moment',fr_hook:'Une actualité à ne pas manquer !',fr_audio:'',en_title:"What's on now",en_hook:'Something special is happening!',en_audio:''});renderAdmin()}
function save(){localStorage.setItem('kettyContent',JSON.stringify(items));localStorage.setItem('kettyVolume',vol);alert('Modifications enregistrées sur cette tablette.')}
</script></body></html>
